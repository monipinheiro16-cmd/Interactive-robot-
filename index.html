<!DOCTYPE html>

<head>

    <title>AI Robot Companion (Looi / Emo style)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        * {
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        body, html {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000000;
            font-family: 'Outfit', sans-serif;
        }
        .font-mono-tech {
            font-family: 'Share Tech Mono', monospace;
        }
        /* Subdued glow effects */
        .glow-cyan {
            box-shadow: 0 0 40px rgba(6, 182, 212, 0.25);
        }
        /* Soft pulse animation for microphone indicator */
        @keyframes subtle-pulse {
            0%, 100% { transform: scale(1); opacity: 0.3; }
            50% { transform: scale(1.2); opacity: 0.8; }
        }
        .animate-subtle-pulse {
            animation: subtle-pulse 2s infinite ease-in-out;
        }
        /* Listening wave animation */
        @keyframes wave-bar {
            0%, 100% { height: 6px; }
            50% { height: 28px; }
        }
        .wave-bar-1 { animation: wave-bar 0.6s infinite ease-in-out 0.0s; }
        .wave-bar-2 { animation: wave-bar 0.6s infinite ease-in-out 0.15s; }
        .wave-bar-3 { animation: wave-bar 0.6s infinite ease-in-out 0.3s; }
        .wave-bar-4 { animation: wave-bar 0.6s infinite ease-in-out 0.45s; }

        /* Custom Scrollbar for Diagnostic Console */

            width: 6px;

        ::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.8);

    </style>

    <canvas id="robot-canvas" class="absolute inset-0 w-full h-full cursor-pointer z-0"></canvas>

    <!-- HEART / SPARKLE TOUCH PARTICLES CONTAINER -->

    <!-- SETTINGS GEAR BUTTON -->

    <!-- SETTINGS & DIAGNOSTICS MODAL -->
    <div id="settings-modal" class="fixed inset-0 z-50 bg-black/85 backdrop-blur-xl flex items-center justify-center p-4 opacity-0 pointer-events-none transition-all duration-300">
        <div class="bg-slate-900 border border-slate-800 w-full max-w-lg rounded-3xl p-6 shadow-2xl relative space-y-4 text-slate-200 max-h-[90vh] flex flex-col">
            
            <!-- Header -->
            <div class="flex items-center justify-between border-b border-slate-800 pb-3 shrink-0">
                <div class="flex items-center gap-2 text-cyan-400">
                    <i class="fa-solid fa-sliders text-sm"></i>
                    <h2 class="font-bold text-sm tracking-wide">Configurações & Diagnóstico API</h2>
                </div>
                <button id="close-settings-btn" class="w-8 h-8 rounded-full bg-slate-800 hover:bg-slate-700 text-slate-400 flex items-center justify-center text-xs transition-colors">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <!-- Scrollable Content -->
            <div class="space-y-4 overflow-y-auto pr-1">
                <!-- Gemini API Key Input -->
                <div class="space-y-1.5">
                    <label class="block text-xs font-mono-tech text-slate-400 uppercase tracking-wider flex justify-between">
                        <span>Chave API Gemini</span>
                        <span class="text-[10px] text-cyan-500">Google AI Studio</span>
                    </label>
                    <input id="api-key-input" type="password" placeholder="AIzaSy... ou AQ..." class="w-full bg-slate-950 border border-slate-800 focus:border-cyan-500/80 rounded-xl px-3 py-2.5 text-xs text-cyan-200 font-mono-tech outline-none transition-colors">
                </div>

                <!-- Color Theme Selector -->
                <div class="space-y-1.5">
                    <label class="block text-xs font-mono-tech text-slate-400 uppercase tracking-wider">
                        Cor dos Olhos
                    </label>
                    <div class="grid grid-cols-4 gap-2">
                        <button onclick="setThemeColors('#06b6d4', '#00f2fe')" class="h-9 rounded-xl bg-gradient-to-br from-cyan-500 to-cyan-300 border border-cyan-400/50 hover:scale-105 transition-transform" title="Cyan"></button>
                        <button onclick="setThemeColors('#a855f7', '#ec4899')" class="h-9 rounded-xl bg-gradient-to-br from-purple-500 to-pink-500 border border-purple-400/50 hover:scale-105 transition-transform" title="Purple/Pink"></button>
                        <button onclick="setThemeColors('#10b981', '#34d399')" class="h-9 rounded-xl bg-gradient-to-br from-emerald-500 to-teal-300 border border-emerald-400/50 hover:scale-105 transition-transform" title="Emerald"></button>
                        <button onclick="setThemeColors('#f59e0b', '#fbbf24')" class="h-9 rounded-xl bg-gradient-to-br from-amber-500 to-yellow-300 border border-amber-400/50 hover:scale-105 transition-transform" title="Amber"></button>
                    </div>
                </div>

                <!-- Voice Pitch Slider -->
                <div class="space-y-2 pt-1 border-t border-slate-800/80">
                    <div class="flex items-center justify-between text-xs text-slate-400 font-mono-tech">
                        <span>TOM DA VOZ (PITCH)</span>
                        <span id="pitch-val">1.3</span>
                    </div>
                    <input id="pitch-slider" type="range" min="0.8" max="1.8" step="0.1" value="1.3" class="w-full h-1.5 bg-slate-800 rounded-lg appearance-none cursor-pointer accent-cyan-400">
                </div>

                <!-- DIAGNOSTICS LOG OVERLAY -->
                <div class="space-y-2 pt-2 border-t border-slate-800/80">
                    <div class="flex items-center justify-between">
                        <label class="text-[11px] font-mono-tech text-cyan-400 uppercase tracking-wider flex items-center gap-1.5">
                            <i class="fa-solid fa-terminal text-[10px]"></i>
                            <span>Logs da API & Respostas Brutas</span>
                        </label>
                        <button id="clear-log-btn" class="text-[10px] text-slate-500 hover:text-slate-300 font-mono-tech underline">
                            Limpar
                        </button>
                    </div>
                    <div id="diagnostic-log" class="bg-slate-950 border border-slate-800 rounded-xl p-3 text-[11px] font-mono-tech text-slate-300 h-36 overflow-y-auto whitespace-pre-wrap leading-relaxed select-text">
                        [SISTEMA] Aguardando teste de requisição Gemini...
                    </div>
                </div>
            </div>

            <!-- Save & Action Footer -->
            <div class="pt-2 shrink-0">
                <button id="save-settings-btn" class="w-full bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold py-2.5 rounded-xl text-xs tracking-wide transition-colors">
                    Salvar e Fechar
                </button>
            </div>
        </div>
    </div>

    <script>
        // --- GLOBALS & APP STATE ---
        const canvas = document.getElementById('robot-canvas');
        const ctx = canvas.getContext('2d');

        // UI References
        const stateDot = document.getElementById('state-dot');
        const stateText = document.getElementById('state-text');
        const speechSubtitle = document.getElementById('speech-subtitle');
        const subtitleText = document.getElementById('subtitle-text');
        const audioWaveBars = document.getElementById('audio-wave-bars');
        const micIconCircle = document.getElementById('mic-icon-circle');
        const micIcon = document.getElementById('mic-icon');
        const settingsModal = document.getElementById('settings-modal');
        const closeSettingsBtn = document.getElementById('close-settings-btn');
        const saveSettingsBtn = document.getElementById('save-settings-btn');
        const gearBtn = document.getElementById('gear-btn');
        const apiKeyInput = document.getElementById('api-key-input');
        const pitchSlider = document.getElementById('pitch-slider');
        const pitchVal = document.getElementById('pitch-val');
        const diagnosticLog = document.getElementById('diagnostic-log');
        const clearLogBtn = document.getElementById('clear-log-btn');

        // Color Themes
        let primaryColor = '#06b6d4';   // Neon Cyan
        let secondaryColor = '#00f2fe'; // Bright Highlight Cyan

        // Robot States: 'IDLE', 'LISTENING', 'THINKING', 'SPEAKING', 'HAPPY'
        let robotState = 'IDLE';

        // Eye Animation Variables
        let dpr = window.devicePixelRatio || 1;
        let targetLookX = 0;
        let targetLookY = 0;
        let currentLookX = 0;
        let currentLookY = 0;
        let blinkProgress = 0;
        let isBlinking = false;
        let lastBlinkTime = Date.now();
        let blinkInterval = 3200;

        let speechAnimPhase = 0;

        // API Key Storage
        let customApiKey = localStorage.getItem('gemini_custom_key') || '';
        if (customApiKey) apiKeyInput.value = customApiKey;

        // Double-Tap Logic
        let lastTapTime = 0;

        // --- DIAGNOSTIC LOG HELPER ---
        function appendLog(msg, type = 'info') {
            const time = new Date().toLocaleTimeString();
            let prefix = `[${time}] `;
            if (type === 'error') prefix += '[ERRO] ';
            else if (type === 'success') prefix += '[OK] ';
            else if (type === 'warn') prefix += '[AVISO] ';
            
            diagnosticLog.innerHTML += `<div class="${type === 'error' ? 'text-red-400' : type === 'success' ? 'text-emerald-400' : type === 'warn' ? 'text-amber-400' : 'text-slate-300'}">${prefix}${escapeHtml(msg)}</div>`;
            diagnosticLog.scrollTop = diagnosticLog.scrollHeight;
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
        }

        clearLogBtn.addEventListener('click', () => {
            diagnosticLog.innerHTML = '[SISTEMA] Logs limpos.\n';
        });

        // --- CANVAS RESIZE & EYE GRAPHICS ENGINE ---
        function resizeCanvas() {
            dpr = window.devicePixelRatio || 1;
            canvas.width = window.innerWidth * dpr;
            canvas.height = window.innerHeight * dpr;
            ctx.scale(dpr, dpr);
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function handlePointerMove(clientX, clientY) {
            const centerX = window.innerWidth / 2;
            const centerY = window.innerHeight / 2;
            
            const normX = (clientX - centerX) / centerX;
            const normY = (clientY - centerY) / centerY;

            targetLookX = normX * 45;
            targetLookY = normY * 30;
        }

        window.addEventListener('mousemove', (e) => handlePointerMove(e.clientX, e.clientY));
        window.addEventListener('touchmove', (e) => {
            if (e.touches.length > 0) {
                handlePointerMove(e.touches[0].clientX, e.touches[0].clientY);
            }
        }, { passive: true });

        // Touch & Click Interactions
        window.addEventListener('pointerdown', (e) => {
            if (settingsModal.classList.contains('opacity-100') && settingsModal.contains(e.target)) return;

            const now = Date.now();
            const tapGap = now - lastTapTime;
            lastTapTime = now;

            if (tapGap < 300) {
                openSettings();
                return;
            }

            if (robotState === 'IDLE') {
                createTouchHearts(e.clientX, e.clientY);
                triggerVoiceRecognition();
            }
        });

        gearBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            openSettings();
        });

        function createTouchHearts(x, y) {
            const container = document.getElementById('particle-container');
            for (let i = 0; i < 3; i++) {
                const heart = document.createElement('div');
                heart.className = 'absolute text-cyan-400 text-xl transition-all duration-700 pointer-events-none opacity-100';
                heart.style.left = `${x + (Math.random() * 40 - 20)}px`;
                heart.style.top = `${y + (Math.random() * 40 - 20)}px`;
                heart.innerHTML = '<i class="fa-solid fa-heart"></i>';

                container.appendChild(heart);

                requestAnimationFrame(() => {
                    heart.style.transform = `translateY(-70px) scale(1.3) rotate(${(Math.random() - 0.5) * 40}deg)`;
                    heart.style.opacity = '0';
                });

                setTimeout(() => heart.remove(), 700);
            }
        }

        function triggerBlink() {
            if (!isBlinking) {
                isBlinking = true;
                blinkProgress = 0;
            }
        }

        function drawEyeShape(centerX, centerY, width, height, isRightEye = false) {
            ctx.save();
            ctx.translate(centerX + currentLookX, centerY + currentLookY);

            const grad = ctx.createLinearGradient(0, -height, 0, height);
            grad.addColorStop(0, secondaryColor);
            grad.addColorStop(1, primaryColor);
            ctx.fillStyle = grad;

            const effectiveHeight = height * (1 - blinkProgress);

            if (effectiveHeight <= 3) {
                ctx.beginPath();
                ctx.strokeStyle = primaryColor;
                ctx.lineWidth = 8;
                ctx.lineCap = 'round';
                ctx.moveTo(-width / 1.3, 0);
                ctx.lineTo(width / 1.3, 0);
                ctx.stroke();
                ctx.restore();
                return;
            }

            ctx.beginPath();

            if (robotState === 'HAPPY') {
                const rx = width / 2;
                const ry = effectiveHeight / 2;
                ctx.roundRect(-rx, -ry, width, effectiveHeight, [ry * 0.8, ry * 0.8, ry * 0.2, ry * 0.2]);
                ctx.fill();

                ctx.globalCompositeOperation = 'destination-out';
                ctx.beginPath();
                ctx.ellipse(0, ry * 0.75, rx * 1.15, ry * 0.75, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalCompositeOperation = 'source-over';

            } else if (robotState === 'LISTENING') {
                const rx = width / 2;
                const ry = effectiveHeight / 2;
                ctx.roundRect(-rx, -ry, width, effectiveHeight * 1.08, ry * 0.5);
                ctx.fill();

            } else if (robotState === 'THINKING') {
                const rx = width / 2;
                const ry = effectiveHeight / 2;
                ctx.rotate(isRightEye ? 0.15 : -0.15);
                ctx.roundRect(-rx, -ry * 0.7, width, effectiveHeight * 0.7, ry * 0.4);
                ctx.fill();

            } else if (robotState === 'SPEAKING') {
                const talkHeight = effectiveHeight + Math.sin(speechAnimPhase) * 12;
                const rx = width / 2;
                const ry = talkHeight / 2;
                ctx.roundRect(-rx, -ry, width, talkHeight, ry * 0.45);
                ctx.fill();

            } else {
                const rx = width / 2;
                const ry = effectiveHeight / 2;
                ctx.roundRect(-rx, -ry, width, effectiveHeight, ry * 0.45);
                ctx.fill();
            }

            if (blinkProgress < 0.25 && robotState !== 'HAPPY') {
                ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
                ctx.beginPath();
                ctx.arc(-width * 0.2, -effectiveHeight * 0.22, width * 0.12, 0, Math.PI * 2);
                ctx.fill();

                ctx.beginPath();
                ctx.arc(width * 0.18, effectiveHeight * 0.2, width * 0.06, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.restore();
        }

        function animate() {
            const width = window.innerWidth;
            const height = window.innerHeight;

            ctx.clearRect(0, 0, width, height);

            currentLookX += (targetLookX - currentLookX) * 0.1;
            currentLookY += (targetLookY - currentLookY) * 0.1;

            if (robotState === 'SPEAKING') {
                speechAnimPhase += 0.25;
            }

            const now = Date.now();
            if (now - lastBlinkTime > blinkInterval) {
                triggerBlink();
                lastBlinkTime = now + (Math.random() * 2500);
            }

            if (isBlinking) {
                blinkProgress += 0.18;
                if (blinkProgress >= 1) {
                    blinkProgress = 1;
                    isBlinking = false;
                }
            } else if (blinkProgress > 0) {
                blinkProgress -= 0.18;
                if (blinkProgress < 0) blinkProgress = 0;
            }

            const eyeWidth = Math.min(width * 0.22, 140);
            const eyeHeight = Math.min(height * 0.35, 180);
            const eyeSpacing = Math.min(width * 0.22, 160);

            const leftEyeX = (width / 2) - eyeSpacing;
            const rightEyeX = (width / 2) + eyeSpacing;
            const eyeY = height / 2;

            drawEyeShape(leftEyeX, eyeY, eyeWidth, eyeHeight, false);
            drawEyeShape(rightEyeX, eyeY, eyeWidth, eyeHeight, true);

            requestAnimationFrame(animate);
        }
        animate();

        // --- STATE & UI CONTROLS ---
        function setRobotState(state, labelText) {
            robotState = state;
            stateText.textContent = labelText || state;

            if (state === 'LISTENING') {
                stateDot.className = 'w-2 h-2 rounded-full bg-cyan-400 animate-ping';
                audioWaveBars.classList.remove('hidden');
                micIconCircle.classList.add('hidden');
            } else if (state === 'THINKING') {
                stateDot.className = 'w-2 h-2 rounded-full bg-purple-400 animate-pulse';
                audioWaveBars.classList.add('hidden');
                micIconCircle.classList.remove('hidden');
                micIcon.className = 'fa-solid fa-brain text-purple-400 animate-spin';
            } else if (state === 'SPEAKING') {
                stateDot.className = 'w-2 h-2 rounded-full bg-emerald-400 animate-pulse';
                audioWaveBars.classList.add('hidden');
                micIconCircle.classList.remove('hidden');
                micIcon.className = 'fa-solid fa-volume-high text-emerald-400';
            } else {
                stateDot.className = 'w-2 h-2 rounded-full bg-cyan-400';
                audioWaveBars.classList.add('hidden');
                micIconCircle.classList.remove('hidden');
                micIcon.className = 'fa-solid fa-microphone';
            }
        }

        function showSubtitle(text) {
            subtitleText.textContent = text;
            speechSubtitle.classList.remove('opacity-0', 'translate-y-4');
            speechSubtitle.classList.add('opacity-100', 'translate-y-0');
        }

        function hideSubtitle() {
            speechSubtitle.classList.add('opacity-0', 'translate-y-4');
            speechSubtitle.classList.remove('opacity-100', 'translate-y-0');
        }

        // --- ROBUST GEMINI AI ENGINE WITH ENDPOINT FALLBACK & FULL DIAGNOSTICS ---
        async function fetchGeminiAIResponse(userPrompt) {
            setRobotState('THINKING', 'PENSANDO...');
            showSubtitle('Pensando...');

            const apiKey = customApiKey.trim();
            if (!apiKey) {
                appendLog("Tentativa de chamada sem chave API.", "warn");
                speakText('Bip! Por favor, insira sua chave da API nas configurações.');
                openSettings();
                return;
            }

            const systemPrompt = `Você é um robô de estimação fofo, altamente inteligente e brincalhão (estilo Looi / Emo). 
Sua personalidade é carinhosa, amigável, curiosa e levemente robótica. 
Responda de forma extremamente curta e direta (máximo 1 ou 2 frases curtas), ideal para voz falada. 
Use um tom alegre em português do Brasil.`;

            const payload = {
                contents: [{ role: 'user', parts: [{ text: systemPrompt + "\n\nUsuário: " + userPrompt }] }]
            };

            // Models to attempt sequentially if one fails
            const candidateModels = [
                'gemini-2.5-flash',
                'gemini-2.0-flash',
                'gemini-1.5-flash'
            ];

            let lastErrorMsg = '';
            appendLog(`Iniciando requisição para o prompt: "${userPrompt.substring(0, 30)}..."`);

            for (const model of candidateModels) {
                appendLog(`Testando modelo: ${model}...`);
                
                // Attempt 1: Query param transmission (?key=)
                const urlQuery = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(apiKey)}`;
                
                try {
                    let response = await fetch(urlQuery, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    // If URL param failed with 400/403, try header fallback transmission
                    if (!response.ok && (response.status === 400 || response.status === 403)) {
                        appendLog(`Tentativa URL falhou (HTTP ${response.status}). Testando envio via Header X-Goog-Api-Key...`, "warn");
                        const urlHeader = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`;
                        response = await fetch(urlHeader, {
                            method: 'POST',
                            headers: { 
                                'Content-Type': 'application/json',
                                'x-goog-api-key': apiKey
                            },
                            body: JSON.stringify(payload)
                        });
                    }

                    if (response.ok) {
                        const data = await response.json();
                        const aiText = data?.candidates?.[0]?.content?.parts?.[0]?.text;
                        if (aiText) {
                            appendLog(`Sucesso no modelo ${model}! HTTP 200`, "success");
                            speakText(aiText);
                            return; // Fully successful!
                        }
                    }

                    // Extract detailed JSON error from Google API
                    const errorJson = await response.json().catch(() => ({}));
                    const rawDetail = JSON.stringify(errorJson, null, 2);
                    lastErrorMsg = `HTTP ${response.status} no modelo '${model}':\n${rawDetail}`;
                    appendLog(lastErrorMsg, "error");

                } catch (netErr) {
                    lastErrorMsg = `Erro de rede/CORS no modelo '${model}': ${netErr.message}`;
                    appendLog(lastErrorMsg, "error");
                }
            }

            // If all model fallbacks failed
            appendLog("Todos os endpoints de modelos falharam. Verifique logs acima.", "error");
            speakText('Bip! Tive um problema ao conectar com a IA. Verifique o diagnóstico nas configurações.');
        }

        // --- WEB SPEECH SYNTHESIS ---
        const synth = window.speechSynthesis;

        function speakText(text) {
            setRobotState('SPEAKING', 'FALANDO');
            showSubtitle(text);

            if (!synth) {
                setTimeout(() => {
                    setRobotState('IDLE', 'PRONTO');
                    hideSubtitle();
                }, 3000);
                return;
            }

            synth.cancel();

            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'pt-BR';
            utterance.pitch = parseFloat(pitchSlider.value);
            utterance.rate = 1.05;

            const voices = synth.getVoices();
            const ptVoice = voices.find(v => v.lang.includes('pt')) || voices[0];
            if (ptVoice) utterance.voice = ptVoice;

            utterance.onend = () => {
                setRobotState('HAPPY', 'ALEGRE');
                setTimeout(() => {
                    setRobotState('IDLE', 'PRONTO');
                    hideSubtitle();
                }, 1800);
            };

            utterance.onerror = () => {
                setRobotState('IDLE', 'PRONTO');
                hideSubtitle();
            };

            synth.speak(utterance);
        }

        // --- WEB SPEECH RECOGNITION ---
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

        function triggerVoiceRecognition() {
            if (robotState !== 'IDLE') return;

            if (!customApiKey) {
                speakText('Insira sua chave API nas configurações primeiro!');
                openSettings();
                return;
            }

            if (!SpeechRecognition) {
                speakText('Seu navegador não suporta reconhecimento de voz.');
                return;
            }

            const recognition = new SpeechRecognition();
            recognition.lang = 'pt-BR';
            recognition.continuous = false;
            recognition.interimResults = false;

            recognition.onstart = () => {
                setRobotState('LISTENING', 'OUVINDO...');
                showSubtitle('Ouvindo você...');
            };

            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                showSubtitle(`"${transcript}"`);
                fetchGeminiAIResponse(transcript);
            };

            recognition.onerror = (e) => {
                setRobotState('IDLE', 'PRONTO');
                showSubtitle('Não entendi bem. Toque para tentar de novo.');
                setTimeout(hideSubtitle, 2000);
            };

            recognition.onend = () => {
                if (robotState === 'LISTENING') {
                    setRobotState('IDLE', 'PRONTO');
                }
            };

            recognition.start();
        }

        // --- SETTINGS & THEME LOGIC ---
        function openSettings() {
            settingsModal.classList.remove('opacity-0', 'pointer-events-none');
            settingsModal.classList.add('opacity-100');
        }

        function closeSettings() {
            settingsModal.classList.add('opacity-0', 'pointer-events-none');
            settingsModal.classList.remove('opacity-100');
        }

        function setThemeColors(primary, secondary) {
            primaryColor = primary;
            secondaryColor = secondary;
            appendLog(`Cor dos olhos atualizada para: ${primary}`);
        }

        closeSettingsBtn.addEventListener('click', closeSettings);
        saveSettingsBtn.addEventListener('click', () => {
            customApiKey = apiKeyInput.value.trim();
            localStorage.setItem('gemini_custom_key', customApiKey);
            closeSettings();
            appendLog("Chave API e configurações salvas.", "success");
            speakText('Configurações salvas!');
        });

        pitchSlider.addEventListener('input', (e) => {
            pitchVal.textContent = e.target.value;
        });

        // Initial Boot Speech & Check
        window.addEventListener('load', () => {
            setTimeout(() => {
                if (!customApiKey) {
                    speakText('Olá! Toque na engrenagem no topo e insira sua chave API para começarmos!');
                    openSettings();
                } else {
                    speakText('Olá! Estou pronto para conversar!');
                }
            }, 600);
        });
    </script>
</body>
</html>
