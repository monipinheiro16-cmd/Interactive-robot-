<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Robô Pet IA</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      background-color: #050508;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      touch-action: none;
    }
    /* Botão discreto para configurações no canto */
    #config-btn {
      position: absolute;
      top: 15px;
      right: 15px;
      width: 40px;
      height: 40px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 50%;
      color: rgba(255, 255, 255, 0.6);
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 10;
      transition: all 0.3s;
    }
    #config-btn:active {
      background: rgba(255, 255, 255, 0.3);
      color: #fff;
    }
    /* Modal de API Key */
    #modal {
      display: none;
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.88);
      backdrop-filter: blur(8px);
      z-index: 20;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    #modal.active {
      display: flex;
    }
    .modal-card {
      background: #12131a;
      border: 1px solid #232636;
      border-radius: 16px;
      padding: 24px;
      width: 100%;
      max-width: 360px;
      color: #fff;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .modal-card h2 {
      font-size: 1.3rem;
      margin-bottom: 8px;
      color: #00f2fe;
    }
    .modal-card p {
      font-size: 0.85rem;
      color: #8a8d9b;
      margin-bottom: 20px;
      line-height: 1.4;
    }
    .modal-card input {
      width: 100%;
      padding: 14px;
      background: #090a0f;
      border: 1px solid #232636;
      border-radius: 8px;
      color: #fff;
      font-size: 0.95rem;
      margin-bottom: 16px;
      outline: none;
    }
    .modal-card input:focus {
      border-color: #00f2fe;
    }
    .modal-card button {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #00c6ff, #0072ff);
      border: none;
      border-radius: 8px;
      color: #fff;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
    }
    .modal-card button:active {
      opacity: 0.9;
    }
  </style>
</head>
<body>

  <button id="config-btn">⚙</button>
  <canvas id="petCanvas"></canvas>

  <div id="modal">
    <div class="modal-card">
      <h2>Gemini API Key</h2>
      <p>Insira sua chave da API do Google AI Studio para o robô poder conversar com você.</p>
      <input type="password" id="api-key-input" placeholder="Cole sua chave aqui (AIzaSy...)" />
      <button id="save-key-btn">Salvar e Iniciar</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('petCanvas');
    const ctx = canvas.getContext('2d');
    const configBtn = document.getElementById('config-btn');
    const modal = document.getElementById('modal');
    const apiKeyInput = document.getElementById('api-key-input');
    const saveKeyBtn = document.getElementById('save-key-btn');

    let apiKey = localStorage.getItem('gemini_api_key') || '';
    
    // Se não tiver chave, abre a caixa automaticamente na cara do usuário
    if (!apiKey) {
      modal.classList.add('active');
    } else {
      apiKeyInput.value = apiKey;
    }

    configBtn.onclick = () => modal.classList.add('active');
    
    saveKeyBtn.onclick = () => {
      apiKey = apiKeyInput.value.trim();
      if (apiKey) {
        localStorage.setItem('gemini_api_key', apiKey);
        modal.classList.remove('active');
      } else {
        alert('Por favor, cole uma chave válida.');
      }
    };

    // Ajuste do Canvas
    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // Estado do Robô
    const state = {
      emotion: 'happy',
      targetX: window.innerWidth / 2,
      targetY: window.innerHeight / 2,
      currentX: window.innerWidth / 2,
      currentY: window.innerHeight / 2,
      blinkProgress: 0,
      isBlinking: false
    };

    // Rastreamento ao toque/mouse
    function updateTarget(e) {
      const x = e.touches ? e.touches[0].clientX : e.clientX;
      const y = e.touches ? e.touches[0].clientY : e.clientY;
      state.targetX = x;
      state.targetY = y;
    }
    window.addEventListener('pointermove', updateTarget);
    window.addEventListener('pointerdown', (e) => {
      updateTarget(e);
      if (!isListening && !isSpeaking) startListening();
    });

    // Piscada automática
    setInterval(() => {
      if (!state.isBlinking && Math.random() < 0.3) {
        state.isBlinking = true;
      }
    }, 2000);

    // Loop de Renderização dos Olhos
    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      state.currentX += (state.targetX - state.currentX) * 0.1;
      state.currentY += (state.targetY - state.currentY) * 0.1;

      if (state.isBlinking) {
        state.blinkProgress += 0.15;
        if (state.blinkProgress >= 1) {
          state.blinkProgress = 0;
          state.isBlinking = false;
        }
      }

      const centerX = canvas.width / 2;
      const centerY = canvas.height / 2;
      const eyeOffset = Math.min(canvas.width, canvas.height) * 0.22;
      const eyeSize = Math.min(canvas.width, canvas.height) * 0.18;

      let eyeColor = '#00f2fe';
      if (state.emotion === 'thinking') eyeColor = '#ff007f';
      if (state.emotion === 'talking') eyeColor = '#00ff88';
      if (state.emotion === 'angry') eyeColor = '#ff3333';

      const lookLimit = eyeSize * 0.4;
      const dx = (state.currentX - centerX) / (canvas.width / 2);
      const dy = (state.currentY - centerY) / (canvas.height / 2);
      const pupilX = dx * lookLimit;
      const pupilY = dy * lookLimit;

      const blinkScaleY = state.isBlinking ? Math.abs(Math.cos(state.blinkProgress * Math.PI)) : 1;

      function drawEye(x) {
        ctx.save();
        ctx.translate(x, centerY);
        ctx.scale(1, blinkScaleY);

        ctx.shadowColor = eyeColor;
        ctx.shadowBlur = 30;

        ctx.fillStyle = eyeColor;
        ctx.beginPath();
        if (state.emotion === 'angry') {
          ctx.roundRect(-eyeSize, -eyeSize, eyeSize * 2, eyeSize * 2, [eyeSize, eyeSize, 10, eyeSize]);
        } else {
          ctx.roundRect(-eyeSize, -eyeSize, eyeSize * 2, eyeSize * 2, eyeSize * 0.8);
        }
        ctx.fill();

        ctx.shadowBlur = 0;
        ctx.fillStyle = '#050508';
        ctx.beginPath();
        ctx.arc(pupilX, pupilY, eyeSize * 0.4, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(pupilX - eyeSize * 0.15, pupilY - eyeSize * 0.15, eyeSize * 0.12, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }

      drawEye(centerX - eyeOffset);
      drawEye(centerX + eyeOffset);

      requestAnimationFrame(render);
    }
    render();

    // --- RECONHECIMENTO DE VOZ & GEMINI IA ---
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition;
    let isListening = false;
    let isSpeaking = false;

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.lang = 'pt-BR';
      recognition.continuous = false;
      recognition.interimResults = false;

      recognition.onstart = () => {
        isListening = true;
        state.emotion = 'thinking';
      };

      recognition.onend = () => {
        isListening = false;
      };

      recognition.onresult = async (event) => {
        const text = event.results[0][0].transcript;
        await askGemini(text);
      };
    }

    function startListening() {
      if (!apiKey) {
        modal.classList.add('active');
        return;
      }
      if (recognition && !isListening && !isSpeaking) {
        try { recognition.start(); } catch (e) {}
      }
    }

    async function askGemini(promptText) {
      state.emotion = 'thinking';

      const systemPrompt = `Você é um pet robô fofo, simpático e inteligente. Responda em português de forma extremamente curta e concisa (máximo de 2 frases curtíssimas) como se fosse um assistente amigável.`;

      try {
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [
              { role: 'user', parts: [{ text: systemPrompt + "\nPergunta do usuário: " + promptText }] }
            ]
          })
        });

        const data = await res.json();

        if (data.error) {
          console.error("Erro da API Gemini:", data.error);
          speak("Sua chave da API teve um problema. Verifique as configurações.");
          return;
        }

        const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || "Não entendi bem...";
        speak(reply);
      } catch (err) {
        console.error("Erro na requisição:", err);
        speak("Bip, tive um probleminha de conexão.");
      }
    }

    function speak(text) {
      if (!('speechSynthesis' in window)) return;

      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'pt-BR';
      utterance.pitch = 1.4;
      utterance.rate = 1.1;

      utterance.onstart = () => {
        isSpeaking = true;
        state.emotion = 'talking';
      };

      utterance.onend = () => {
        isSpeaking = false;
        state.emotion = 'happy';
      };

      window.speechSynthesis.speak(utterance);
    }
  </script>
</body>
</html>
