<!DOCTYPE html>
<html lang="pt-BR" class="h-full bg-black text-white select-none overflow-hidden">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>AI Robot Companion</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  * { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  body, html { width:100%; height:100%; margin:0; padding:0; overflow:hidden; background:#000; font-family:'Outfit',sans-serif; }
  .font-mono-tech { font-family:'Share Tech Mono',monospace; }
  @keyframes subtle-pulse { 0%,100%{transform:scale(1);opacity:.3} 50%{transform:scale(1.2);opacity:.8} }
  .animate-subtle-pulse { animation: subtle-pulse 2s infinite ease-in-out; }
  @keyframes wave-bar { 0%,100%{height:6px} 50%{height:28px} }
  .wave-bar-1{animation:wave-bar .6s infinite ease-in-out 0s}
  .wave-bar-2{animation:wave-bar .6s infinite ease-in-out .15s}
  .wave-bar-3{animation:wave-bar .6s infinite ease-in-out .3s}
  .wave-bar-4{animation:wave-bar .6s infinite ease-in-out .45s}
  #top-status-bar { top: calc(env(safe-area-inset-top, 0px) + 1rem); }
  #gear-btn { top: calc(env(safe-area-inset-top, 0px) + 1rem); }
  #touch-mic-trigger { bottom: calc(env(safe-area-inset-bottom, 0px) + 1.25rem); }
  #speech-subtitle-container { bottom: calc(env(safe-area-inset-bottom, 0px) + 4rem); }
</style>
</head>
<body class="h-full w-full bg-black relative flex items-center justify-center">

<canvas id="robot-canvas" class="absolute inset-0 w-full h-full cursor-pointer z-0"></canvas>

<div id="top-status-bar" class="absolute left-6 right-20 z-10 flex justify-between items-center pointer-events-none opacity-40 font-mono-tech text-xs text-cyan-400">
  <div class="flex items-center gap-2">
    <span id="state-dot" class="w-2 h-2 rounded-full bg-cyan-400"></span>
    <span id="state-text" class="tracking-wider uppercase">PRONTO</span>
  </div>
  <div class="text-[10px] text-slate-500 uppercase tracking-widest hidden sm:block">Toque para Falar • 2 Toques: Configurações</div>
</div>

<div id="speech-subtitle-container" class="absolute left-6 right-6 z-10 pointer-events-none flex justify-center">
  <div id="speech-subtitle" class="max-w-md bg-slate-950/80 backdrop-blur-md border border-cyan-500/30 rounded-2xl px-5 py-3 text-center text-sm font-medium text-cyan-100 opacity-0 translate-y-4 transition-all duration-300 shadow-2xl">
    <span id="subtitle-text">...</span>
  </div>
</div>

<div id="touch-mic-trigger" class="absolute z-10 flex flex-col items-center pointer-events-none p-3">
  <div id="audio-wave-bars" class="hidden items-center gap-1.5 h-8 mb-1">
    <div class="w-1 bg-cyan-400 rounded-full wave-bar-1"></div>
    <div class="w-1 bg-cyan-400 rounded-full wave-bar-2"></div>
    <div class="w-1 bg-cyan-400 rounded-full wave-bar-3"></div>
    <div class="w-1 bg-cyan-400 rounded-full wave-bar-4"></div>
  </div>
  <div id="mic-icon-circle" class="w-8 h-8 rounded-full bg-cyan-950/40 border border-cyan-500/30 text-cyan-400 flex items-center justify-center text-xs opacity-40 animate-subtle-pulse">
    <i id="mic-icon" class="fa-solid fa-microphone"></i>
  </div>
</div>

<div id="settings-modal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-xl flex items-center justify-center p-4 opacity-0 pointer-events-none transition-all duration-300">
  <div class="bg-slate-900 border border-slate-800 w-full max-w-sm rounded-3xl p-6 shadow-2xl relative space-y-5 text-slate-200">
    <div class="flex items-center justify-between border-b border-slate-800 pb-3">
      <div class="flex items-center gap-2 text-cyan-400">
        <i class="fa-solid fa-sliders text-sm"></i>
        <h2 class="font-bold text-sm tracking-wide">Configurações do Robô</h2>
      </div>
      <button id="close-settings-btn" class="w-8 h-8 rounded-full bg-slate-800 hover:bg-slate-700 text-slate-400 flex items-center justify-center text-xs"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="space-y-2">
      <label class="block text-xs font-mono-tech text-slate-400 uppercase tracking-wider">Chave API Gemini</label>
      <input id="api-key-input" type="password" autocomplete="off" placeholder="Cole sua API Key aqui..." class="w-full bg-slate-950 border border-slate-800 focus:border-cyan-500/80 rounded-xl px-3 py-2.5 text-xs text-cyan-200 font-mono-tech outline-none">
    </div>
    <div class="space-y-2">
      <label class="block text-xs font-mono-tech text-slate-400 uppercase tracking-wider">Cor dos Olhos</label>
      <div class="grid grid-cols-4 gap-2">
        <button data-p="#06b6d4" data-s="#00f2fe" class="theme-btn h-10 rounded-xl bg-gradient-to-br from-cyan-500 to-cyan-300 border border-cyan-400/50"></button>
        <button data-p="#a855f7" data-s="#ec4899" class="theme-btn h-10 rounded-xl bg-gradient-to-br from-purple-500 to-pink-500 border border-purple-400/50"></button>
        <button data-p="#10b981" data-s="#34d399" class="theme-btn h-10 rounded-xl bg-gradient-to-br from-emerald-500 to-teal-300 border border-emerald-400/50"></button>
        <button data-p="#f59e0b" data-s="#fbbf24" class="theme-btn h-10 rounded-xl bg-gradient-to-br from-amber-500 to-yellow-300 border border-amber-400/50"></button>
      </div>
    </div>
    <div class="space-y-3 pt-2 border-t border-slate-800">
      <div class="flex items-center justify-between text-xs text-slate-400 font-mono-tech">
        <span>TOM DA VOZ (PITCH)</span><span id="pitch-val">1.3</span>
      </div>
      <input id="pitch-slider" type="range" min="0.8" max="1.8" step="0.1" value="1.3" class="w-full h-1.5 bg-slate-800 rounded-lg appearance-none cursor-pointer accent-cyan-400">
    </div>
    <div class="space-y-2 pt-2 border-t border-slate-800">
      <button id="test-btn" class="w-full bg-slate-800 hover:bg-slate-700 text-cyan-300 font-bold py-2 rounded-xl text-xs tracking-wide">Testar conexão</button>
      <p id="test-result" class="text-[11px] text-slate-400 font-mono-tech break-words"></p>
    </div>
    <button id="save-settings-btn" class="w-full bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold py-2.5 rounded-xl text-xs tracking-wide">Salvar e Fechar</button>
  </div>
</div>

<div id="particle-container" class="absolute inset-0 pointer-events-none z-20 overflow-hidden"></div>

<button id="gear-btn" class="absolute right-6 z-10 w-9 h-9 rounded-full bg-slate-900/60 border border-cyan-500/30 text-cyan-400 flex items-center justify-center text-xs opacity-60 hover:opacity-100">
  <i class="fa-solid fa-gear"></i>
</button>

<script>
// ---------- Polyfill roundRect (navegadores antigos) ----------
if (!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
    const rr = Array.isArray(r) ? r : [r, r, r, r];
    const [tl, tr, br, bl] = rr.length === 4 ? rr : [rr[0], rr[0], rr[0], rr[0]];
    this.moveTo(x + tl, y);
    this.lineTo(x + w - tr, y); this.quadraticCurveTo(x + w, y, x + w, y + tr);
    this.lineTo(x + w, y + h - br); this.quadraticCurveTo(x + w, y + h, x + w - br, y + h);
    this.lineTo(x + bl, y + h); this.quadraticCurveTo(x, y + h, x, y + h - bl);
    this.lineTo(x, y + tl); this.quadraticCurveTo(x, y, x + tl, y);
    this.closePath();
  };
}

// ---------- Storage seguro ----------
const store = {
  get(k, d = '') { try { return localStorage.getItem(k) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} }
};

// ---------- Referências ----------
const $ = id => document.getElementById(id);
const canvas = $('robot-canvas'), ctx = canvas.getContext('2d');
const stateDot = $('state-dot'), stateText = $('state-text');
const speechSubtitle = $('speech-subtitle'), subtitleText = $('subtitle-text');
const audioWaveBars = $('audio-wave-bars'), micIconCircle = $('mic-icon-circle'), micIcon = $('mic-icon');
const settingsModal = $('settings-modal'), apiKeyInput = $('api-key-input');
const pitchSlider = $('pitch-slider'), pitchVal = $('pitch-val');

// ---------- Estado ----------
let primaryColor = store.get('robot_primary', '#06b6d4');
let secondaryColor = store.get('robot_secondary', '#00f2fe');
let robotState = 'IDLE';
let dpr = 1;
let targetLookX = 0, targetLookY = 0, currentLookX = 0, currentLookY = 0;
let blinkProgress = 0, isBlinking = false, lastBlinkTime = Date.now();
const blinkInterval = 3200;
let speechAnimPhase = 0;
let customApiKey = store.get('gemini_custom_key', '');
apiKeyInput.value = customApiKey;
pitchSlider.value = store.get('robot_pitch', '1.3');
pitchVal.textContent = pitchSlider.value;

let idleTimer = null, hideSubtitleTimer = null, safetyTimer = null;
let recognition = null;
let speakId = 0;
let currentUtterance = null; // evita coleta de lixo do utterance (bug do Chrome)

// ---------- Canvas ----------
function resizeCanvas() {
  dpr = window.devicePixelRatio || 1;
  canvas.width = window.innerWidth * dpr;
  canvas.height = window.innerHeight * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

function handlePointerMove(x, y) {
  const cx = window.innerWidth / 2, cy = window.innerHeight / 2;
  targetLookX = ((x - cx) / cx) * 45;
  targetLookY = ((y - cy) / cy) * 30;
}
window.addEventListener('pointermove', e => handlePointerMove(e.clientX, e.clientY));

// ---------- Toques ----------
let lastTapTime = 0, tapTimer = null;
window.addEventListener('pointerdown', e => {
  if (e.target.closest('#settings-modal') || e.target.closest('#gear-btn')) return;
  const now = Date.now();
  const isDouble = now - lastTapTime < 300;
  lastTapTime = now;
  handlePointerMove(e.clientX, e.clientY);

  if (isDouble) {
    clearTimeout(tapTimer); tapTimer = null;
    lastTapTime = 0;
    openSettings();
    return;
  }
  // Espera para ver se é toque duplo antes de começar a ouvir
  const x = e.clientX, y = e.clientY;
  tapTimer = setTimeout(() => {
    tapTimer = null;
    if (robotState === 'IDLE') { createTouchHearts(x, y); triggerVoiceRecognition(); }
  }, 300);
});

$('gear-btn').addEventListener('click', e => { e.stopPropagation(); openSettings(); });

function createTouchHearts(x, y) {
  const container = $('particle-container');
  for (let i = 0; i < 3; i++) {
    const h = document.createElement('div');
    h.className = 'absolute text-cyan-400 text-xl pointer-events-none';
    h.style.cssText = `left:${x + Math.random() * 40 - 20}px;top:${y + Math.random() * 40 - 20}px;opacity:1;transition:all .7s ease-out`;
    h.innerHTML = '<i class="fa-solid fa-heart"></i>';
    container.appendChild(h);
    requestAnimationFrame(() => requestAnimationFrame(() => {
      h.style.transform = `translateY(-70px) scale(1.3) rotate(${(Math.random() - 0.5) * 40}deg)`;
      h.style.opacity = '0';
    }));
    setTimeout(() => h.remove(), 800);
  }
}

// ---------- Olhos ----------
function drawEyeShape(cx, cy, width, height, isRight) {
  ctx.save();
  ctx.translate(cx + currentLookX, cy + currentLookY);

  const grad = ctx.createLinearGradient(0, -height, 0, height);
  grad.addColorStop(0, secondaryColor);
  grad.addColorStop(1, primaryColor);
  ctx.fillStyle = grad;

  const eh = height * (1 - blinkProgress);

  if (eh <= 3) {
    ctx.beginPath();
    ctx.strokeStyle = primaryColor; ctx.lineWidth = 8; ctx.lineCap = 'round';
    ctx.moveTo(-width / 1.3, 0); ctx.lineTo(width / 1.3, 0);
    ctx.stroke(); ctx.restore(); return;
  }

  const rx = width / 2, ry = eh / 2;

  if (robotState === 'HAPPY') {
    // Olho feliz "^" (arco), sem usar destination-out que apagava o outro olho
    ctx.beginPath();
    ctx.strokeStyle = grad; ctx.lineWidth = Math.max(10, width * 0.14); ctx.lineCap = 'round';
    ctx.arc(0, ry * 0.35, rx * 0.8, Math.PI * 1.12, Math.PI * 1.88);
    ctx.stroke(); ctx.restore(); return;
  }

  ctx.beginPath();
  if (robotState === 'LISTENING') {
    ctx.roundRect(-rx, -ry, width, eh * 1.08, ry * 0.5);
  } else if (robotState === 'THINKING') {
    ctx.rotate(isRight ? 0.15 : -0.15);
    ctx.roundRect(-rx, -ry * 0.7, width, eh * 0.7, ry * 0.4);
  } else if (robotState === 'SPEAKING') {
    const th = Math.max(8, eh + Math.sin(speechAnimPhase) * 12);
    ctx.roundRect(-rx, -th / 2, width, th, (th / 2) * 0.45);
  } else {
    ctx.roundRect(-rx, -ry, width, eh, ry * 0.45);
  }
  ctx.fill();

  if (blinkProgress < 0.25) {
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.beginPath(); ctx.arc(-width * 0.2, -eh * 0.22, width * 0.12, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(width * 0.18, eh * 0.2, width * 0.06, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}

function animate() {
  const w = window.innerWidth, h = window.innerHeight;
  ctx.clearRect(0, 0, w, h);

  currentLookX += (targetLookX - currentLookX) * 0.1;
  currentLookY += (targetLookY - currentLookY) * 0.1;
  if (robotState === 'SPEAKING') speechAnimPhase += 0.25;

  const now = Date.now();
  if (!isBlinking && now - lastBlinkTime > blinkInterval) {
    isBlinking = true;
    lastBlinkTime = now + Math.random() * 2500;
  }
  if (isBlinking) {
    blinkProgress += 0.18;
    if (blinkProgress >= 1) { blinkProgress = 1; isBlinking = false; }
  } else if (blinkProgress > 0) {
    blinkProgress = Math.max(0, blinkProgress - 0.18);
  }

  const ew = Math.min(w * 0.22, 140), eh = Math.min(h * 0.35, 180), sp = Math.min(w * 0.22, 160);
  drawEyeShape(w / 2 - sp, h / 2, ew, eh, false);
  drawEyeShape(w / 2 + sp, h / 2, ew, eh, true);
  requestAnimationFrame(animate);
}
animate();

// ---------- UI de estado ----------
function setRobotState(state, label) {
  robotState = state;
  stateText.textContent = label || state;
  audioWaveBars.classList.add('hidden'); audioWaveBars.classList.remove('flex');
  micIconCircle.classList.remove('hidden');

  if (state === 'LISTENING') {
    stateDot.className = 'w-2 h-2 rounded-full bg-cyan-400 animate-ping';
    audioWaveBars.classList.remove('hidden'); audioWaveBars.classList.add('flex');
    micIconCircle.classList.add('hidden');
  } else if (state === 'THINKING') {
    stateDot.className = 'w-2 h-2 rounded-full bg-purple-400 animate-pulse';
    micIcon.className = 'fa-solid fa-brain text-purple-400 animate-spin';
  } else if (state === 'SPEAKING') {
    stateDot.className = 'w-2 h-2 rounded-full bg-emerald-400 animate-pulse';
    micIcon.className = 'fa-solid fa-volume-high text-emerald-400';
  } else {
    stateDot.className = 'w-2 h-2 rounded-full bg-cyan-400';
    micIcon.className = 'fa-solid fa-microphone';
  }
}

function showSubtitle(text) {
  clearTimeout(hideSubtitleTimer);
  subtitleText.textContent = text;
  speechSubtitle.classList.remove('opacity-0', 'translate-y-4');
  speechSubtitle.classList.add('opacity-100', 'translate-y-0');
}
function hideSubtitle() {
  speechSubtitle.classList.add('opacity-0', 'translate-y-4');
  speechSubtitle.classList.remove('opacity-100', 'translate-y-0');
}
function goIdle(delay = 0, withHappy = false) {
  clearTimeout(idleTimer); clearTimeout(safetyTimer);
  const finish = () => { setRobotState('IDLE', 'PRONTO'); hideSubtitleTimer = setTimeout(hideSubtitle, 0); };
  if (withHappy) {
    setRobotState('HAPPY', 'ALEGRE');
    idleTimer = setTimeout(finish, 1800);
  } else {
    idleTimer = setTimeout(finish, delay);
  }
}

// ---------- Gemini ----------
async function fetchGeminiAIResponse(userPrompt) {
  setRobotState('THINKING', 'PENSANDO...');
  showSubtitle('Pensando...');

  const apiKey = customApiKey.trim();
  if (!apiKey) {
    speakText('Bip! Por favor, insira sua chave da API nas configurações.');
    openSettings();
    return;
  }

  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 45000);

  try {
    const sys = 'Você é um robô de estimação fofo, inteligente e brincalhão (estilo Looi / Emo). ' +
      'Personalidade carinhosa, amigável, curiosa e levemente robótica. ' +
      'Responda de forma extremamente curta (máximo 1 ou 2 frases), ideal para voz. ' +
      'Use tom alegre em português do Brasil, sem markdown, sem emojis e sem asteriscos.';

    const makeBody = model => JSON.stringify({
      systemInstruction: { parts: [{ text: sys }] },
      contents: [{ role: 'user', parts: [{ text: userPrompt }] }],
      generationConfig: {
        maxOutputTokens: 200,
        // desliga o "pensar" nos modelos 2.5 (bem mais rápido para conversa por voz)
        ...(/2\.5/.test(model) ? { thinkingConfig: { thinkingBudget: 0 } } : {})
      }
    });

    const models = window.__availableModels?.length
      ? window.__availableModels.slice(0, 4)
      : ['gemini-2.5-flash-lite', 'gemini-2.5-flash', 'gemini-2.0-flash', 'gemini-flash-latest'];
    let response = null, errInfo = '', timedOut = false;

    for (const model of models) {
      // cada tentativa tem seu próprio limite de 10 s
      const attemptCtl = new AbortController();
      const attemptTimer = setTimeout(() => attemptCtl.abort(), 10000);
      controller.signal.addEventListener('abort', () => attemptCtl.abort(), { once: true });
      try {
        response = await fetch(
          `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`,
          { method: 'POST', signal: attemptCtl.signal,
            headers: { 'Content-Type': 'application/json', 'x-goog-api-key': apiKey },
            body: makeBody(model) }
        );
      } catch (e) {
        clearTimeout(attemptTimer);
        if (controller.signal.aborted) throw e;      // tempo total esgotado
        timedOut = true; errInfo = `timeout (${model})`;
        console.error('Gemini timeout:', model);
        continue;                                    // tenta o próximo modelo
      }
      clearTimeout(attemptTimer);
      if (response.ok) { timedOut = false; break; }

      let msg = '';
      try { msg = (await response.json())?.error?.message || ''; } catch {}
      errInfo = `${response.status} (${model}): ${msg}`;
      console.error('Gemini HTTP error:', errInfo);
      // chave inválida ou limite: trocar de modelo não ajuda
      if (response.status === 403 || response.status === 429 || /API key/i.test(errInfo)) break;
    }

    if (!response || timedOut) {
      speakText('Bip! A conexão está muito lenta. Tente de novo.');
      return;
    }

    if (!response.ok) {
      showSubtitle('Erro ' + errInfo.slice(0, 120));
      if (response.status === 403 || /API key/i.test(errInfo)) {
        speakText('Bip! Sua chave API parece inválida. Confira nas configurações.');
      } else if (response.status === 429) {
        speakText('Bip! Falei demais por hoje. Tente de novo em instantes.');
      } else if (response.status === 503) {
        speakText('Bip! O servidor está sobrecarregado. Tente de novo daqui a pouco.');
      } else {
        speakText('Bip! O servidor deu um erro ' + response.status + '. Tente de novo.');
      }
      return;
    }

    const data = await response.json();
    let text = (data?.candidates?.[0]?.content?.parts || []).map(p => p.text || '').join(' ');
    text = text.replace(/[*_`#>~]/g, '').replace(/\s+/g, ' ').trim();
    speakText(text || 'Bip bop! Não entendi muito bem!');
  } catch (err) {
    console.error('Gemini Error:', err);
    speakText(err.name === 'AbortError'
      ? 'Bip! Demorei demais para pensar. Tente de novo.'
      : 'Bip! Estou sem conexão com a internet.');
  } finally {
    clearTimeout(timeout);
  }
}

// ---------- Voz (síntese) ----------
const synth = window.speechSynthesis;
let voices = [];
function loadVoices() { if (synth) voices = synth.getVoices(); }
if (synth) {
  loadVoices();
  synth.addEventListener?.('voiceschanged', loadVoices);
}

function speakText(text) {
  clearTimeout(idleTimer); clearTimeout(safetyTimer);
  const myId = ++speakId;
  setRobotState('SPEAKING', 'FALANDO');
  showSubtitle(text);

  const fallbackMs = Math.min(15000, 2000 + text.length * 80);

  if (!synth) { goIdle(3000); return; }

  synth.cancel();
  const u = new SpeechSynthesisUtterance(text);
  currentUtterance = u;
  u.lang = 'pt-BR';
  u.pitch = parseFloat(pitchSlider.value) || 1;
  u.rate = 1.05;
  const v = voices.find(v => v.lang === 'pt-BR') || voices.find(v => v.lang.toLowerCase().startsWith('pt'));
  if (v) u.voice = v;

  // Ignora eventos de utterances antigos (synth.cancel() dispara onerror no anterior)
  u.onend = () => { if (myId === speakId) goIdle(0, true); };
  u.onerror = () => { if (myId === speakId) goIdle(0); };

  // Segurança: se o navegador nunca disparar onend, não trava no estado "FALANDO"
  safetyTimer = setTimeout(() => { if (myId === speakId) goIdle(0); }, fallbackMs + 8000);

  setTimeout(() => { if (myId === speakId) synth.speak(u); }, 50);
}

// ---------- Reconhecimento de voz ----------
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

function triggerVoiceRecognition() {
  if (robotState !== 'IDLE') return;

  if (!customApiKey) {
    speakText('Insira sua chave API nas configurações primeiro!');
    openSettings();
    return;
  }
  if (!SpeechRecognition) {
    speakText('Opa! Seu navegador não suporta reconhecimento de voz.');
    return;
  }

  recognition = new SpeechRecognition();
  recognition.lang = 'pt-BR';
  recognition.continuous = false;
  recognition.interimResults = false;
  let gotResult = false;

  recognition.onstart = () => { setRobotState('LISTENING', 'OUVINDO...'); showSubtitle('Ouvindo você...'); };

  recognition.onresult = e => {
    gotResult = true;
    const transcript = e.results[0][0].transcript;
    showSubtitle(`"${transcript}"`);
    fetchGeminiAIResponse(transcript);
  };

  recognition.onerror = e => {
    gotResult = true; // evita tratar de novo no onend
    setRobotState('IDLE', 'PRONTO');
    const msg = (e.error === 'not-allowed' || e.error === 'service-not-allowed')
      ? 'Permita o uso do microfone para eu te ouvir.'
      : e.error === 'no-speech' ? 'Não ouvi nada. Toque para tentar de novo.'
      : e.error === 'aborted' ? '' : 'Não consegui ouvir. Toque para tentar de novo.';
    if (msg) { showSubtitle(msg); hideSubtitleTimer = setTimeout(hideSubtitle, 2500); } else hideSubtitle();
  };

  recognition.onend = () => {
    if (robotState === 'LISTENING') {
      setRobotState('IDLE', 'PRONTO');
      if (!gotResult) hideSubtitle();
    }
  };

  try { recognition.start(); }
  catch (err) { console.error(err); setRobotState('IDLE', 'PRONTO'); }
}

// ---------- Configurações ----------
function openSettings() {
  try { recognition && recognition.abort(); } catch {}
  settingsModal.classList.remove('opacity-0', 'pointer-events-none');
  settingsModal.classList.add('opacity-100');
}
function closeSettings() {
  settingsModal.classList.add('opacity-0', 'pointer-events-none');
  settingsModal.classList.remove('opacity-100');
}

document.querySelectorAll('.theme-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    primaryColor = btn.dataset.p; secondaryColor = btn.dataset.s;
    store.set('robot_primary', primaryColor); store.set('robot_secondary', secondaryColor);
  });
});

$('close-settings-btn').addEventListener('click', closeSettings);
$('save-settings-btn').addEventListener('click', () => {
  customApiKey = apiKeyInput.value.trim();
  store.set('gemini_custom_key', customApiKey);
  store.set('robot_pitch', pitchSlider.value);
  closeSettings();
  speakText('Configurações salvas!');
});

$('test-btn').addEventListener('click', async () => {
  const out = $('test-result');
  const key = apiKeyInput.value.trim();
  if (!key) { out.textContent = 'Cole a chave primeiro.'; return; }
  out.textContent = 'Testando...';
  const t0 = performance.now();
  const ctl = new AbortController();
  const tm = setTimeout(() => ctl.abort(), 10000);
  try {
    const r = await fetch('https://generativelanguage.googleapis.com/v1beta/models?pageSize=100',
      { headers: { 'x-goog-api-key': key }, signal: ctl.signal });
    const ms = Math.round(performance.now() - t0);
    if (r.ok) {
      const d = await r.json();
      const names = (d.models || [])
        .filter(m => (m.supportedGenerationMethods || []).includes('generateContent'))
        .map(m => m.name.replace('models/', ''))
        .filter(n => /^gemini-.*flash/.test(n) && !/(image|tts|live|preview|exp|audio|thinking|vision)/.test(n))
        .sort((a, b) => (/lite/.test(b) - /lite/.test(a)));
      window.__availableModels = names;
      out.textContent = `OK em ${ms} ms. Modelos: ` + (names.slice(0, 5).join(', ') || 'nenhum flash disponível');
    } else {
      const d = await r.json().catch(() => ({}));
      out.textContent = `Erro ${r.status}: ${d?.error?.message || 'sem detalhes'}`;
    }
  } catch (e) {
    out.textContent = e.name === 'AbortError'
      ? 'Sem resposta em 10 s: a rede está lenta ou bloqueando o Google.'
      : 'Falha de rede/bloqueio: ' + e.message;
  } finally { clearTimeout(tm); }
});

pitchSlider.addEventListener('input', e => { pitchVal.textContent = e.target.value; });

// ---------- Saudação inicial ----------
window.addEventListener('load', () => {
  setTimeout(() => {
    if (!customApiKey) {
      showSubtitle('Toque na engrenagem e coloque sua chave API!');
      openSettings();
    } else {
      speakText('Olá! Eu sou seu pet de Inteligência Artificial!');
    }
  }, 600);
});
</script>
</body>
</html>
